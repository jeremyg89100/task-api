name: secrets 
on: workflow_dispatch

jobs: 
  secret:
    runs-on: ubuntu-latest

    environment: DEMO_TOKEN
    
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
    steps:
      - name: Vérifier le secret
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "secret absent"
            exit 1
          fi
          echo "longueur : ${#DEMO_TOKEN}"
          echo ${{ vars.APP_ENV }}
